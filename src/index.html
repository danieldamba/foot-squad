<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foot Squad</title>
</head>

<body>

  <div id="root">
    <header>
      <h1>Foot Squad</h1>
      <div>
        <button id="add-player" class="addBtn">Add Player</button>
        <button id="add-country" class="addBtn">Add Country</button>
      </div>
    </header>
    <div id="main">
      <div id="sidebar">
        <button id="dashboard-btn" class="showBtn">Dashboard</button>
        <button id="show-players" class="showBtn">Players</button>
        <button id="show-countries" class="showBtn">All Countries</button>
        <p>Latest News</p>
      </div>
      <div id="main-content">

      </div>
    </div>
  </div>

  <div id="modal-root">

    <dialog id="player-modal" class="modal">
      <div class="modal-content">
        <button id="close-player-modal" class="close-button">X</button>
        <form id="player-form">
          <div>
            <label for="player-name">Player Name:</label>
            <input type="text" id="player-name" name="player-name" required>
          </div>

          <div>
            <label for="player-position">Position:</label>
            <select id="player-position" name="player-position" required></select>
          </div>

          <div>
            <label for="player-age">Age:</label>
            <input type="number" id="player-age" name="player-age" min="16" max="50" required>
          </div>

          <div>
            <label for="player-country">Country</label>
            <select id="player-country" name="player_country" required>
              <option value="">Select a country</option>
            </select>
          </div>

          <div>
            <label for="player-level">Level (1 - 5)</label>
            <input type="number" id="player-level" name="player-level" min="1" max="5" required>
          </div>

          <div>
            <label for="end-Contract">Contract end Date:</label>
            <input type="datetime-local" id="end-Contract" name="end-Contract" required>
          </div>

          <button type="submit" id="add-player-btn" class="addBtn">Add Player</button>
        </form>
      </div>
    </dialog>

    <dialog id="delete-player-modal" class="modal">
      <div class="modal-content">
        <p>Are you sure you want to delete this player?</p>
        <button id="confirm-delete" class="confirm-button">Yes</button>
        <button id="cancel-delete" class="cancel-button">No</button>
      </div>
    </dialog>

    <dialog id="error-modal" class="modal">
      <div class="modal-content">
        <p id="error-message"></p>
        <button id="close-error-modal" class="close-button">OK</button>
      </div>
    </dialog>

    <dialog id="country-modal">
      <div class="modal-content">
        <button id="close-country-modal" class="close-button">X</button>
        <form id="country-form">
          <div>
            <label for="country_name">Country Name:</label>
            <input type="text" id="country_name" name="country_name" required>
          </div>

          <div>
            <label for="country_continent">Country Continent:</label>
            <input type="text" id="country_continent" name="country_continent" required>
          </div>

          <button type="submit" id="add-country-btn" class="addBtn">Add Country</button>
        </form>
      </div>
    </dialog>
  </div>
</body>

</html>
